name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cboxdk/php-baseimages/php-cli:${{ matrix.php || '8.4' }}-bookworm-dev-v1
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --with "orchestra/testbench:${{ matrix.laravel == '12' && '^10.0' || '^11.0' }}"

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run tests
        run: vendor/bin/pest

      - name: Audit locked dependencies
        run: composer audit --locked

      - name: Check dependency licenses
        run: php bin/check-licenses.php

      - name: Check generated requirements
        run: |
          php bin/generate-requirements.php
          git diff --exit-code -- docs/requirements.md
